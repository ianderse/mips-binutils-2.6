name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write  # publishing a tag's release

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Building binutils for Linux
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison file gperf

      - name: Configure for mips
        run: |
          ./configure --target=mips-kmc-elf --prefix=/opt/cross --disable-gprof --disable-gdb --disable-werror --host=i386-pc-linux --build=i386-pc-linux

      - name: Make
        env:
          # -std=gnu89: the C these sources are written in. Current GCC defaults to C23, where bfd.h's own `false`
          # and `true` are keywords, and treats implicit declarations as errors
          CFLAGS: -std=gnu89 -static -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
        run: |
          make -C bfd CFLAGS="$CFLAGS"
          make -C opcodes CFLAGS="$CFLAGS"
          make -C libiberty CFLAGS="$CFLAGS"
          make -C gas CFLAGS="$CFLAGS"
          make -C binutils CFLAGS="$CFLAGS"

      - name: Test for file
        run: |
          test -f binutils/ar
          file binutils/ar

      - name: Same output as the v0.3 release
        run: sh ci/compare-with-release.sh gas/as.new https://github.com/decompals/mips-binutils-2.6/releases/download/v0.3/binutils-2.6-linux.tar.gz

      - name: Create release archive
        run: |
          cp binutils/ar ar
          cp gas/as.new as
          cp binutils/strip.new strip
          cp binutils/objcopy objcopy
          cp binutils/c++filt c++filt
          strip ar as strip objcopy c++filt
          chmod +x ar as strip objcopy c++filt
          tar -czf binutils-2.6-linux.tar.gz ar as strip objcopy c++filt

      - uses: actions/upload-artifact@v4
        with:
          name: binutils-2.6-linux
          path: binutils-2.6-linux.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: binutils-2.6-linux.tar.gz

  macos:
    # Universal binaries (arm64 + x86_64), see macos/build.sh. The archive keeps its old name, so what downloaded the
    # Intel-only build gets these.
    runs-on: macos-latest
    name: Building binutils for macOS (universal)
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: sh macos/build.sh dist

      - name: Check both architectures are there and run
        run: |
          for p in ar as strip objcopy c++filt; do
            lipo dist/$p -verify_arch arm64 x86_64
          done
          printf 'nop\n' > t.s
          dist/as -EL -o t.o t.s && file t.o
          arch -x86_64 dist/as -EL -o t.o t.s && file t.o

      - name: Same output as the v0.3 release (its Intel build, under Rosetta), both architectures
        run: |
          printf '#!/bin/sh\nexec arch -arm64 %s/dist/as "$@"\n' "$PWD" > as-arm64
          printf '#!/bin/sh\nexec arch -x86_64 %s/dist/as "$@"\n' "$PWD" > as-x86_64
          chmod +x as-arm64 as-x86_64
          for a in as-arm64 as-x86_64; do
            sh ci/compare-with-release.sh "$PWD/$a" https://github.com/decompals/mips-binutils-2.6/releases/download/v0.3/binutils-2.6-mac.tar.gz
          done

      - name: Create release archive
        run: tar -czf binutils-2.6-mac.tar.gz -C dist ar as strip objcopy c++filt

      - uses: actions/upload-artifact@v4
        with:
          name: binutils-2.6-mac
          path: binutils-2.6-mac.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: binutils-2.6-mac.tar.gz
